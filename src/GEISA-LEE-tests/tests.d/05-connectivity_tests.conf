if [ -z "${GLEE_TESTS}" ] || echo "${GLEE_TESTS}" | grep -Eq "(^| )connectivity_tests($| )"; then
	logging suite "GEISA LEE - Connectivity tests"
	cukinia_log "$(_colorize blue "--- GEISA LEE - Connectivity tests ---")"

	test_id "GEISA-LEE-CONNECTIVITY-01" \
	as "Checking kernel support ipv4" \
	cukinia_kconf INET y

	check_ipv6_runtime() {
		config_value=
		for config_path in "/proc/config.gz" "/boot/config-$(uname -r)"; do
			if [ -r "$config_path" ]; then
				case "$config_path" in
					*.gz) config_line=$(zcat "$config_path" 2>/dev/null | sed -n 's/^CONFIG_IPV6=//p' | head -n 1) ;;
					*) config_line=$(sed -n 's/^CONFIG_IPV6=//p' "$config_path" | head -n 1) ;;
				esac
				if [ -n "$config_line" ]; then
					config_value=$config_line
					break
				fi
			fi
		done

		case "$config_value" in
			y) ;;
			m)
				if [ ! -d /sys/module/ipv6 ] && ! grep -q '^ipv6 ' /proc/modules; then
					printf 'IPv6 is configured as a module but is not loaded\n' >&2
					return 1
				fi
			;;
			*)
				printf 'IPv6 kernel configuration is unavailable or unsupported: %s\n' "$config_value" >&2
				return 1
			;;
		esac

		for sysctl_path in /proc/sys/net/ipv6/conf/all/disable_ipv6 /proc/sys/net/ipv6/conf/default/disable_ipv6; do
			if [ "$(cat "$sysctl_path" 2>/dev/null)" != "0" ]; then
				printf 'IPv6 is disabled by %s\n' "$sysctl_path" >&2
				return 1
			fi
		done

		if ! command -v ip >/dev/null 2>&1 || ! ip -6 addr show >/dev/null 2>&1 || ! ip -6 route show >/dev/null 2>&1; then
			printf 'IPv6 runtime inspection is unavailable\n' >&2
			return 1
		fi

		printf 'IPv6 runtime support is available (CONFIG_IPV6=%s, stack enabled)\n' "$config_value"
	}

	test_id "GEISA-LEE-CONNECTIVITY-02" \
	as "Checking IPv6 runtime support (CONFIG_IPV6=y or m, stack enabled)" \
	cukinia_cmd check_ipv6_runtime

	for dev in $(ip -o link show up | awk -F': ' '{print $2}' | grep -Ev '^(lo|docker0|veth|br-)'); do
	    MTU=$(cat /sys/class/net/"$dev"/mtu)
	    test_id "GEISA-LEE-CONNECTIVITY-03" \
	    as "Checking device ${dev} has a minimum of ${MINIMUM_FUNCTIONAL_MTU} bytes MTU (MTU: ${MTU} bytes)" \
	    cukinia_test "$MTU" -ge "${MINIMUM_FUNCTIONAL_MTU}"
	done
fi
