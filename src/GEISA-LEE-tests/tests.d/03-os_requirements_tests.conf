if [ -z "${GLEE_TESTS}" ] || echo "${GLEE_TESTS}" | grep -Eq "(^| )os_requirements_tests($| )"; then
	logging suite "GEISA LEE - OS requirements tests"
	cukinia_log "$(_colorize blue "--- GEISA LEE - OS requirements tests ---")"

	test_id "GEISA-LEE-OS-01" \
	as "Checking OS is linux based" \
	cukinia_test $(uname | grep -c "Linux") -eq 1

	KERNEL_VERSION=$(uname -r | cut -d. -f1,2)
	KERNEL_MAJOR=${KERNEL_VERSION%%.*}

	test_id "GEISA-LEE-OS-02" \
	as "Checking Linux kernel version is 6.x or later (kernel version $KERNEL_VERSION)" \
	cukinia_test "$KERNEL_MAJOR" -ge 6

	report_kernel_version_lts() {
	    kernel_version=$1
	    kernel_versions_list=$2

	    for version in $kernel_versions_list; do
		if [ "$version" = "$kernel_version" ]; then
		    printf 'advisory: kernel version %s is in the configured LTS reference list\n' "$kernel_version"
		    return 0
		fi
	    done
	    printf 'advisory: kernel version %s is not in the configured LTS reference list; the list is not a normative GEISA gate\n' "$kernel_version"
	    return 0
	}

	test_id "GEISA-LEE-OS-03" \
	as "Advisory: report whether kernel version $KERNEL_VERSION is in the LTS reference list" \
	cukinia_cmd report_kernel_version_lts "$KERNEL_VERSION" "$KERNEL_VERSIONS_LTS"

	for binary in $BASE_BINARIES; do
	    test_id "GEISA-LEE-OS-04" \
	    as "Checking $binary binary is installed" \
	    cukinia_test $(which $binary | wc -l) -gt 0
	done

	for library in $BASE_LIBRARIES; do
	    test_id "GEISA-LEE-OS-05" \
	    as "Checking $library library is installed" \
	    cukinia_test $(/usr/sbin/ldconfig -p | grep -c "$library") -gt 0
	done

	test_id "GEISA-LEE-OS-06" \
	as "Checking Domain Name Service (DNS) is configured" \
	cukinia_test $(cat /etc/resolv.conf | grep -c "nameserver") -gt 0

	when "which getent" \
	test_id "GEISA-LEE-OS-07" \
	as "Checking Domain Name Service (DNS) is working" \
	cukinia_cmd getent hosts github.com

	unless "[ -z $CURRENT_DATE_UTC ]" \
	test_id "GEISA-LEE-OS-08" \
	as "Checking Network Time Protocol (NTP) is used (Current date: $(date -u +'%Y-%m-%d_%H:%M')) (Skipped if host date variable is not set)" \
	cukinia_test $(date -u +"%Y-%m-%d_%H:%M" | grep -c "$CURRENT_DATE_UTC") -eq 1
fi
